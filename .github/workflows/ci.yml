name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 类型检查要与基准提交算 merge-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile
        run: python -m py_compile bridge.py doctor.py
      - name: Type check (changed lines)
        run: python scripts/typecheck_diff.py "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Docker build
        run: docker build -t cms-tg-ingest:test .
